<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUCtool 调试模式</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div>
        <h1>调试模式</h1>
        <span class="sub">功耗墙 / 键盘 LED</span>
      </div>
      <span class="hint">修改功耗有硬件风险, 请谨慎操作</span>
    </header>

    <section class="card">
      <div class="card-title">功耗墙 (TDP)</div>
      <div class="field-grid">
        <div class="field">
          <label for="cpu1">CPU PL1(长时功耗)</label>
          <div class="unit-input">
            <input type="number" id="cpu1" min="0" max="255" placeholder="—">
            <span class="unit">W</span>
          </div>
        </div>
        <div class="field">
          <label for="cpu2">CPU PL2(瞬时功耗)</label>
          <div class="unit-input">
            <input type="number" id="cpu2" min="0" max="255" placeholder="—">
            <span class="unit">W</span>
          </div>
        </div>
        <div class="field">
          <label for="gpu1">GPU PL1(仅 Arc GPU)</label>
          <div class="unit-input">
            <input type="number" id="gpu1" min="0" max="255" placeholder="—">
            <span class="unit">W</span>
          </div>
        </div>
        <div class="field">
          <label for="gpu2">GPU PL2(仅 Arc GPU)</label>
          <div class="unit-input">
            <input type="number" id="gpu2" min="0" max="255" placeholder="—">
            <span class="unit">W</span>
          </div>
        </div>
        <div class="field">
          <label for="tcc">温度墙偏移 (TCC Offset)</label>
          <div class="unit-input">
            <input type="number" id="tcc" min="0" max="100" placeholder="—">
            <span class="unit">°C</span>
          </div>
        </div>
      </div>
      <div class="row-actions">
        <button id="readTdp" class="btn">读取当前</button>
        <button id="applyTdp" class="btn btn-primary">应用更改</button>
        <span id="tdpMsg" class="hint"></span>
      </div>
    </section>

    <section class="card">
      <div class="card-title">键盘 LED</div>
      <div class="led-layout">
        <div>
          <div class="slider-row">
            <label for="rgb_r">R</label>
            <input type="range" id="rgb_r" min="0" max="50" value="0">
            <output id="r_val">0</output>
          </div>
          <div class="slider-row">
            <label for="rgb_g">G</label>
            <input type="range" id="rgb_g" min="0" max="50" value="0">
            <output id="g_val">0</output>
          </div>
          <div class="slider-row">
            <label for="rgb_b">B</label>
            <input type="range" id="rgb_b" min="0" max="50" value="0">
            <output id="b_val">0</output>
          </div>
          <div class="row-actions">
            <button id="applyRgb" class="btn">应用 RGB</button>
            <span class="hint">自定义颜色接口逆向中, 暂未生效</span>
          </div>
        </div>
        <div class="led-preview">
          <div class="color-preview" id="colorPreview"></div>
          <div class="toggle-row">
            <div class="switch" id="rgbToggle" role="switch" aria-checked="false" tabindex="0"></div>
            <span>彩色模式</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/tdp.js" type="module"></script>
</body>
</html>
