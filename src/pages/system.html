<section id="page-system" class="page">

  <header class="page-header">

    <div class="page-heading">

      <h1 data-i18n="system.title">
        系统配置
      </h1>

      <p class="page-subtitle" data-i18n="system.subtitle">
        调整系统相关配置
      </p>

    </div>

  </header>


  <!-- ===================================================
       电池
       =================================================== -->

  <div class="tdp-card">

    <div class="tdp-header">

      <div>

        <div class="tdp-title" data-i18n="system.battery">
          电池
        </div>

        <div class="tdp-description" data-i18n="system.batteryDescription">
          调整电池充电相关设置
        </div>

      </div>

    </div>
    <!-- 电池健康优化器 -->
    <div class="settings-option fan-mode-option">

      <div class="settings-option-info">

        <div class="settings-option-title" data-i18n="system.batteryHealthOptimizer">
          电池健康优化器
        </div>

        <div class="settings-option-description" data-i18n="system.batteryHealthDescription">
          选择电池充电策略
        </div>

      </div>


      <select id="battery-health-mode" class="settings-language-select">

        <option value="0" data-i18n="system.batteryHealthFull">
          充电达到 100% 电量
        </option>

        <option value="1" data-i18n="system.batteryHealthCustom">
          定制
        </option>

        <option value="2" data-i18n="system.batteryHealthBest">
          最佳电池健康
        </option>

      </select>

    </div>

    <div id="battery-custom-limit" class="battery-custom-limit">

      <div class="battery-limit-item">

        <div class="battery-limit-header">

          <span class="battery-limit-label" data-i18n="system.chargingLimit">
            充电限制
          </span>

          <span class="battery-limit-current" data-i18n="system.currentValue">
            当前值
          </span>

        </div>

        <div class="battery-limit-input-row">

          <input id="battery_charglimit" class="battery-limit-input" type="number" min="0" max="100" step="1"
            placeholder="--" />

          <span class="battery-limit-unit" data-i18n="common.percent">
            %
          </span>

          <button id="battery-charging-limit-set" class="battery-limit-set-btn" type="button" data-i18n="system.write">
            写入
          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- =========================================================
     GSC Driver Check
     ========================================================= -->
  <div class="settings-card gsc-settings-card" id="gsc-check">
    <div class="settings-card-header">
      <div class="settings-card-info">
        <h3 class="settings-card-title" data-i18n="system.gsc.title">
          Stutter-free Driver Check
        </h3>
        <p class="settings-card-description" data-i18n="system.gsc.description">
          Verifies the Graphics System Controller Firmware Interface driver version
        </p>
      </div>
    </div>
    <span class="settings-status" id="gsc-badge" hidden></span>
    <div class="gsc-versions" id="gsc-versions" hidden>
      <div class="gsc-version-row">
        <span class="gsc-version-label" data-i18n="system.gsc.installed">
          Installed
        </span>
        <span class="gsc-version-value" id="gsc-installed">—</span>
      </div>

      <div class="gsc-version-row">
        <span class="gsc-version-label" data-i18n="system.gsc.recommended">
          Recommended
        </span>
        <span class="gsc-version-value gsc-version-value--ok" id="gsc-recommended">
          31.0.101.5590
        </span>
      </div>
    </div>

    <div class="gsc-actions" id="gsc-actions" hidden>
      <button type="button" class="action-btn primary" id="gsc-how-to-fix" data-i18n="system.gsc.howToFix">
        How to fix
      </button>
    </div>
  </div>


</section>
