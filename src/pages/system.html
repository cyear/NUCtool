<section id="page-system" class="page">

  <header class="page-header">

    <div class="page-heading">

      <h1 data-i18n="system.title">
        系统配置
      </h1>

      <p class="page-subtitle" data-i18n="system.subtitle">
        调整系统相关配置
      </p>

    </div>

  </header>


  <!-- ===================================================
       电池
       =================================================== -->

  <div class="tdp-card">

    <div class="tdp-header">

      <div>

        <div class="tdp-title" data-i18n="system.battery">
          电池
        </div>

        <div class="tdp-description" data-i18n="system.batteryDescription">
          调整电池充电相关设置
        </div>

      </div>

    </div>


    <div class="tdp-section">

      <div class="tdp-section-title" data-i18n="system.battery">
        Battery
      </div>

      <div class="tdp-grid">

        <!-- Charging Limit -->
        <div class="tdp-item">

          <div class="tdp-item-header">

            <span class="tdp-label" data-i18n="system.chargingLimit">
              充电限制
            </span>

            <span
              class="tdp-current"
              data-i18n="system.currentValue">
              当前值
            </span>

          </div>

          <div class="tdp-input-row">

            <input
              id="battery_charglimit"
              class="tdp-input"
              type="number"
              min="0"
              max="100"
              step="1"
              placeholder="--" />

            <span
              class="tdp-unit"
              data-i18n="common.percent">
              %
            </span>

            <button
              class="tdp-set-btn"
              data-tdp="battery_charglimit"
              type="button"
              data-i18n="system.write">
              写入
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- =========================================================
     GSC Driver Check
     ========================================================= -->
<div class="settings-card gsc-settings-card" id="gsc-check">
  <div class="settings-card-header">
    <div class="settings-card-info">
      <h3 class="settings-card-title" data-i18n="system.gsc.title">
        Stutter-free Driver Check
      </h3>
      <p class="settings-card-description" data-i18n="system.gsc.description">
        Verifies the Graphics System Controller Firmware Interface driver version
      </p>
    </div>
  </div>
  <span class="settings-status" id="gsc-badge" hidden></span>
  <div class="gsc-versions" id="gsc-versions" hidden>
    <div class="gsc-version-row">
      <span class="gsc-version-label" data-i18n="system.gsc.installed">
        Installed
      </span>
      <span class="gsc-version-value" id="gsc-installed">—</span>
    </div>

    <div class="gsc-version-row">
      <span class="gsc-version-label" data-i18n="system.gsc.recommended">
        Recommended
      </span>
      <span class="gsc-version-value gsc-version-value--ok" id="gsc-recommended">
        31.0.101.5590
      </span>
    </div>
  </div>

  <div class="gsc-actions" id="gsc-actions" hidden>
    <button type="button" class="action-btn primary" id="gsc-how-to-fix"
            data-i18n="system.gsc.howToFix">
      How to fix
    </button>
  </div>
</div>


</section>
