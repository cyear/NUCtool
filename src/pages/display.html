<!-- ===================================================
     显示设置
     =================================================== -->
<section id="page-display" class="page">

  <header class="page-header">

    <div class="page-heading">

      <h1 data-i18n="display.title">
        显示设置
      </h1>

      <p class="page-subtitle" data-i18n="display.subtitle">
        调整设备显示模式
      </p>

    </div>

  </header>


  <!-- 显示模式 -->
  <div class="display-card">

    <div class="display-header">

      <div>

        <div class="display-title" data-i18n="display.displayMode">
          显示模式
        </div>

        <div class="display-description" data-i18n="display.displayDescription">
          选择适合当前使用场景的显示配置，显示的模式仅为显示，请以选择后为准
        </div>

      </div>

    </div>


    <div class="display-options">

      <!-- 默认 -->
      <button class="display-btn active" data-display="5" type="button">

        <span class="display-btn-title" data-i18n="display.default">
          默认
        </span>

        <span class="display-btn-description" data-i18n="display.defaultDescription">
          默认不修改, 再次选择关闭
        </span>

      </button>


      <!-- Standard -->
      <button class="display-btn" data-display="0" type="button">

        <span class="display-btn-title" data-i18n="display.standard">
          Standard
        </span>

        <span class="display-btn-description" data-i18n="display.standardDescription">
          标准显示模式
        </span>

      </button>


      <!-- Gaming -->
      <button class="display-btn" data-display="1" type="button">

        <span class="display-btn-title" data-i18n="display.gaming">
          Gaming
        </span>

        <span class="display-btn-description" data-i18n="display.gamingDescription">
          游戏显示模式
        </span>

      </button>


      <!-- Video -->
      <button class="display-btn" data-display="2" type="button">

        <span class="display-btn-title" data-i18n="display.video">
          Video
        </span>

        <span class="display-btn-description" data-i18n="display.videoDescription">
          视频显示模式
        </span>

      </button>


      <!-- Reading -->
      <button class="display-btn" data-display="3" type="button">

        <span class="display-btn-title" data-i18n="display.reading">
          Reading
        </span>

        <span class="display-btn-description" data-i18n="display.readingDescription">
          阅读显示模式
        </span>

      </button>


      <!-- Custom -->
      <button class="display-btn" data-display="4" type="button">

        <span class="display-btn-title" data-i18n="display.custom">
          Custom
        </span>

        <span class="display-btn-description" data-i18n="display.customDescription">
          自定义显示模式
        </span>

      </button>

    </div>

  </div>

</section>
