<!-- ===================================================
     设置
     =================================================== -->
<section id="page-settings" class="page">

  <header class="page-header">

    <div class="page-heading">

      <h1 data-i18n="settings.title">
        设置
      </h1>

      <p class="page-subtitle" data-i18n="settings.subtitle">
        配置 NUCtool
      </p>

    </div>

  </header>


  <!-- 开机启动 -->
  <div class="settings-card">

    <div class="settings-card-header">

      <div>

        <div class="settings-card-title" data-i18n="settings.autostartTitle">
          开机自启动 & 自动控制
        </div>

        <div class="settings-card-description" data-i18n="settings.autostartDescription">
          开机后NUCtool自动启动风扇控制
        </div>

      </div>

      <div
        id="autostart-status"
        class="settings-status"
        data-i18n="settings.autostartChecking">
        检查中...
      </div>

    </div>


    <div class="settings-option">

      <div class="settings-option-info">

        <div class="settings-option-title" data-i18n="settings.startup">
          开机启动
        </div>

        <div
          id="autostart-description"
          class="settings-option-description"
          data-i18n="settings.startupDescription">
          登录Windows后自动运行NUCtool
        </div>

      </div>


      <label class="settings-switch">

        <input
          id="autostart-toggle"
          type="checkbox" />

        <span class="settings-slider"></span>

      </label>

    </div>

  </div>


  <!-- 语言 -->
  <div class="settings-card">

    <div class="settings-option language-option">

      <div class="settings-option-info">

        <div class="settings-option-title" data-i18n="settings.languageTitle">
          语言
        </div>

      </div>

      <select
        id="language-select"
        class="settings-language-select">

        <option
          value="auto"
          data-i18n="settings.languageAuto">
          跟随系统
        </option>

        <option
          value="zh-CN"
          data-i18n="settings.languageChinese">
          简体中文
        </option>

        <option
          value="en-US"
          data-i18n="settings.languageEnglish">
          English
        </option>

        <option
          value="ja-JP"
          data-i18n="settings.languageJapanese">
          日本語
        </option>

        <option
          value="ru-RU"
          data-i18n="settings.languageRussian">
          Русский
        </option>

      </select>

    </div>

  </div>

</section>
