<!-- ===================================================
     设置
     =================================================== -->
<section id="page-settings" class="page">

  <header class="page-header">

    <div class="page-heading">

      <h1 data-i18n="settings.title">
        设置
      </h1>

      <p class="page-subtitle" data-i18n="settings.subtitle">
        配置 NUCtool
      </p>

    </div>

  </header>


  <!-- 开机启动 -->
  <div class="settings-card">

    <div class="settings-card-header">

      <div>

        <div class="settings-card-title" data-i18n="settings.autostartTitle">
          开机自启动
        </div>

        <div class="settings-card-description" data-i18n="settings.autostartDescription">
          登录 Windows 后自动运行 NUCtool
        </div>

      </div>

      <div
        id="autostart-status"
        class="settings-status"
        data-i18n="settings.autostartChecking">
        检查中...
      </div>

    </div>


    <div class="settings-option">

      <div class="settings-option-info">

        <div class="settings-option-title" data-i18n="settings.startup">
          开机启动
        </div>

        <div
          id="autostart-description"
          class="settings-option-description"
          data-i18n="settings.startupDescription">
          登录Windows后自动运行NUCtool
        </div>

      </div>


      <label class="settings-switch">

        <input
          id="autostart-toggle"
          type="checkbox" />

        <span class="settings-slider"></span>

      </label>

    </div>

    <!-- 风扇自启动 -->
    <div class="settings-option fan-mode-option">
      <div class="settings-option-info">
        <label for="auto-fan-mode-select" class="settings-option-title" data-i18n="settings.autoFanTitle">
          风扇自启动
        </label>
        <div class="settings-option-description" data-i18n="settings.autoFanDescription">
          NUCtool 随 Windows 自启或手动带 --fan-control 启动时使用的风扇控制模式
        </div>
      </div>

      <select id="auto-fan-mode-select" class="settings-language-select" disabled>
        <option value="0" data-i18n="settings.autoFanOff">关闭</option>
        <option value="1" data-i18n="settings.autoFanLegacy">旧风扇控制</option>
        <option value="2" data-i18n="settings.autoFanNew">新风扇控制</option>
      </select>
    </div>
    <div id="auto-fan-read-error" class="settings-option-description" data-i18n="settings.readFailed" role="status" hidden>
      读取失败
    </div>

    <!-- 风扇模式 -->
    <div class="settings-option fan-mode-option">
      <div class="settings-option-info">
        <div class="settings-option-title" data-i18n="settings.fanModeTitle">风扇模式</div>
        <div class="settings-option-description" data-i18n="settings.fanModeDescription">设置两个风扇的控制方式</div>
      </div>
      <span class="fan-version-badge old">旧</span>
      <select id="fan-mode-select" class="settings-language-select" value="1">
        <option value="0" data-i18n="settings.independent">独立</option>
        <option value="1" data-i18n="settings.mainPriority" selected>主风扇优先</option>
        <option value="2" data-i18n="settings.secondaryPriority">分风扇优先</option>
      </select>
    </div>
  </div>

  <!-- 日志 -->
  <div class="settings-card">
    <div class="settings-option log-option">
      <div class="settings-option-info">
        <div class="settings-option-title" data-i18n="settings.logTitle">日志记录</div>
        <div class="settings-option-description" data-i18n="settings.logDescription">启用后将日志写入 NUCtool.log；也可使用 --log 启动</div>
      </div>
      <label class="settings-switch">
        <input id="log-toggle" type="checkbox" />
        <span class="settings-slider"></span>
      </label>
    </div>
    <div id="log-read-error" class="settings-option-description" data-i18n="settings.readFailed" role="status" hidden>读取失败</div>
  </div>


  <!-- 语言 -->
  <div class="settings-card">

    <div class="settings-option language-option">

      <div class="settings-option-info">

        <div class="settings-option-title" data-i18n="settings.languageTitle">
          语言
        </div>

      </div>

      <select
        id="language-select"
        class="settings-language-select">

        <option
          value="auto"
          data-i18n="settings.languageAuto">
          跟随系统
        </option>

        <option
          value="zh-CN"
          data-i18n="settings.languageChinese">
          简体中文
        </option>

        <option
          value="en-US"
          data-i18n="settings.languageEnglish">
          English
        </option>

        <option
          value="ja-JP"
          data-i18n="settings.languageJapanese">
          日本語
        </option>

        <option
          value="ru-RU"
          data-i18n="settings.languageRussian">
          Русский
        </option>

      </select>

    </div>

  </div>


</section>
