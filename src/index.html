<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUCtool</title>
    <link rel="stylesheet" href="assets/app.css">
    <script src="assets/chart.js"></script>
    <script src="assets/chartjs-plugin-dragdata.js"></script>
</head>
<body>
    <main class="page">
        <header class="page-head">
            <div>
                <h1>NUCtool</h1>
                <span class="sub">风扇曲线控制</span>
            </div>
            <div class="status-pill" id="statusPill">
                <span class="dot"></span>
                <span id="statusText">未运行</span>
            </div>
        </header>

        <section class="charts">
            <div class="card">
                <div class="card-title">
                    <span class="swatch" style="background: var(--cpu)"></span>
                    CPU 风扇曲线
                    <span class="hint">拖动节点调整</span>
                </div>
                <div class="chart-box"><canvas id="leftFanCurve"></canvas></div>
            </div>
            <div class="card">
                <div class="card-title">实时转速 <span class="hint">RPM</span></div>
                <div class="chart-box"><canvas id="rpmChart"></canvas></div>
            </div>
            <div class="card">
                <div class="card-title">
                    <span class="swatch" style="background: var(--gpu)"></span>
                    GPU 风扇曲线
                    <span class="hint">拖动节点调整</span>
                </div>
                <div class="chart-box"><canvas id="rightFanCurve"></canvas></div>
            </div>
            <div class="card">
                <div class="card-title">实时温度 <span class="hint">°C</span></div>
                <div class="chart-box"><canvas id="tempChart"></canvas></div>
            </div>
        </section>

        <footer class="actions">
            <button id="startStopButton" class="btn btn-primary">启动控制</button>
            <span class="spacer"></span>
            <button id="loadConfigButton" class="btn">加载配置</button>
            <button id="saveConfigButton" class="btn">保存配置</button>
        </footer>
    </main>

    <script src="main.js" type="module"></script>
</body>
</html>
