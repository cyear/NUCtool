<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NUCtool</title>

  <!-- 主样式 -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Chart.js -->
  <script src="assets/chart.js"></script>

  <!-- Chart.js 拖动插件 -->
  <script src="assets/chartjs-plugin-dragdata.js"></script>
</head>

<body>
  <div class="app-layout">

    <!-- =====================================================
         侧边栏
         ===================================================== -->
    <aside class="sidebar">

      <!-- Logo -->
      <div class="sidebar-header">
        <div class="logo">
          NUCtool
        </div>

        <div class="logo-subtitle">
          System Control
        </div>
      </div>

      <!-- 导航 -->
      <nav class="sidebar-nav">

        <button class="nav-btn active" data-page="monitor" type="button">
          <span class="nav-icon">◉</span>
          <span class="nav-text">性能监控</span>
        </button>

        <button class="nav-btn" data-page="fan" type="button">
          <span class="nav-icon">✽</span>
          <span class="nav-text">风扇控制</span>
        </button>

        <button class="nav-btn" data-page="power" type="button">
          <span class="nav-icon">ϟ</span>
          <span class="nav-text">功耗设置</span>
        </button>

        <button class="nav-btn" data-page="settings" type="button">
          <span class="nav-icon">⚙</span>
          <span class="nav-text">设置</span>
        </button>

      </nav>

      <!-- 侧边栏底部 -->
      <div class="sidebar-footer">
        <span class="sidebar-version">
          NUCtool
        </span>

        <span class="sidebar-version">
          v1.0.0-Beta
        </span>
      </div>

    </aside>


    <!-- =====================================================
         主内容区域
         ===================================================== -->
    <main class="content">

      <!-- ===================================================
           性能监控
           =================================================== -->
      <section id="page-monitor" class="page active">

        <!-- 页面标题 -->
        <header class="page-header">

          <div class="page-heading">
            <h1>性能监控</h1>

            <p class="page-subtitle">
              实时查看系统温度与风扇状态
            </p>
          </div>

          <div class="status" id="status">
            <span class="status-dot"></span>
            <span class="status-text">连接中...</span>
          </div>

        </header>


        <!-- 监控卡片 -->
        <div class="cards">

          <!-- CPU 温度 -->
          <div class="metric-card">

            <div class="metric-header">
              <span class="metric-label">
                CPU 温度
              </span>

              <span class="metric-indicator cpu"></span>
            </div>

            <div class="metric-value-row">
              <span class="metric-value" id="cpu-temp">
                --
              </span>

              <span class="metric-unit">
                °C
              </span>
            </div>

          </div>


          <!-- GPU 温度 -->
          <div class="metric-card">

            <div class="metric-header">
              <span class="metric-label">
                GPU 温度
              </span>

              <span class="metric-indicator gpu"></span>
            </div>

            <div class="metric-value-row">
              <span class="metric-value" id="gpu-temp">
                --
              </span>

              <span class="metric-unit">
                °C
              </span>
            </div>

          </div>


          <!-- Main 风扇 -->
          <div class="metric-card">

            <div class="metric-header">
              <span class="metric-label">
                Main 风扇转速
              </span>

              <span class="metric-indicator fan-main"></span>
            </div>

            <div class="metric-value-row">
              <span class="metric-value" id="fan1-rpm">
                --
              </span>

              <span class="metric-unit">
                RPM
              </span>
            </div>

          </div>


          <!-- Secondary 风扇 -->
          <div class="metric-card">

            <div class="metric-header">
              <span class="metric-label">
                Secondary 风扇转速
              </span>

              <span class="metric-indicator fan-secondary"></span>
            </div>

            <div class="metric-value-row">
              <span class="metric-value" id="fan2-rpm">
                --
              </span>

              <span class="metric-unit">
                RPM
              </span>
            </div>

          </div>

        </div>

      </section>


      <!-- ===================================================
           风扇控制
           =================================================== -->
      <section id="page-fan" class="page">

        <!-- 页面标题 -->
        <header class="page-header">

          <div class="page-heading">
            <h1>风扇控制</h1>

            <p class="page-subtitle">
              根据温度调整风扇曲线
            </p>
          </div>

          <div class="status" id="fan-status">
            <span class="status-dot"></span>
            <span class="status-text">未运行</span>
          </div>

        </header>


        <!-- 风扇控制区域 -->
        <div class="fan-section">

          <!-- 操作栏 -->
          <div class="control-bar">

            <div class="control-left">

              <button id="startStopButton" class="action-btn primary" type="button">
                启动控制
              </button>

            </div>


            <div class="control-right">

              <button id="loadConfigButton" class="action-btn" type="button">
                加载配置
              </button>

              <button id="saveConfigButton" class="action-btn" type="button">
                保存配置
              </button>

            </div>

          </div>


          <!-- 风扇曲线 -->
          <div class="fan-grid">

            <!-- Main -->
            <div class="chart-card">

              <div class="chart-header">

                <div class="chart-title">

                  <span class="chart-dot main"></span>

                  <span>
                    Main 风扇曲线
                  </span>

                </div>

                <span class="chart-hint">
                  拖动节点调整
                </span>

              </div>

              <div class="chart-container">
                <canvas id="leftFanCurve"></canvas>
              </div>

            </div>


            <!-- Secondary -->
            <div class="chart-card">

              <div class="chart-header">

                <div class="chart-title">

                  <span class="chart-dot secondary"></span>

                  <span>
                    Secondary 风扇曲线
                  </span>

                </div>

                <span class="chart-hint">
                  拖动节点调整
                </span>

              </div>

              <div class="chart-container">
                <canvas id="rightFanCurve"></canvas>
              </div>

            </div>

          </div>

        </div>

      </section>


      <!-- ===================================================
           功耗设置
           =================================================== -->
      <section id="page-power" class="page">

        <header class="page-header">

          <div class="page-heading">
            <h1>功耗设置</h1>

            <p class="page-subtitle">
              调整处理器功耗限制
            </p>
          </div>

        </header>


        <div class="empty-card">
          <div class="empty-title">
            功耗设置
          </div>

          <div class="empty-description">
            功耗控制功能将在这里显示。
          </div>
        </div>

      </section>


      <!-- ===================================================
           设置
           =================================================== -->
      <section id="page-settings" class="page">

        <header class="page-header">

          <div class="page-heading">
            <h1>设置</h1>

            <p class="page-subtitle">
              配置 NUCtool
            </p>
          </div>

        </header>


        <div class="empty-card">
          <div class="empty-title">
            设置
          </div>

          <div class="empty-description">
            应用设置将在这里显示。
          </div>
        </div>

      </section>

    </main>

  </div>


  <!-- =====================================================
       主程序
       必须最后加载
       ===================================================== -->
  <script type="module" src="main.js"></script>

</body>

</html>
