<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NUCtool</title>

  <!-- 主样式 -->
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- Chart.js -->
  <script src="assets/chart.js"></script>

  <!-- Chart.js 拖动插件 -->
  <script src="assets/chartjs-plugin-dragdata.js"></script>
</head>

<body>
  <div class="app-layout">

    <!-- =====================================================
         侧边栏
         ===================================================== -->
    <aside class="sidebar">

      <!-- Logo -->
      <div class="sidebar-header">
        <div class="logo">
          NUCtool
        </div>

        <div class="logo-subtitle" data-i18n="app.systemControl">
          System Control
        </div>
      </div>

      <!-- 导航 -->
      <nav class="sidebar-nav">

        <button class="nav-btn active" data-page="monitor" type="button">
          <span class="nav-icon">◉</span>
          <span class="nav-text" data-i18n="nav.monitor">
            性能监控
          </span>
        </button>

        <button class="nav-btn" data-page="tuning" type="button">
          <span class="nav-icon">✦</span>
          <span class="nav-text" data-i18n="nav.tuning">
            性能调优
          </span>
        </button>

        <button class="nav-btn" data-page="fan" type="button">
          <span class="nav-icon">✽</span>
          <span class="nav-text" data-i18n="nav.fan">
            风扇控制
          </span>
        </button>

        <button class="nav-btn" data-page="display" type="button">
          <span class="nav-icon">▣</span>
          <span class="nav-text" data-i18n="nav.display">
            显示设置
          </span>
        </button>

        <button class="nav-btn" data-page="keyboard" type="button">
          <span class="nav-icon">⌨</span>
          <span class="nav-text" data-i18n="nav.keyboard">
            键盘设置
          </span>
        </button>

        <button class="nav-btn" data-page="settings" type="button">
          <span class="nav-icon">⚙</span>
          <span class="nav-text" data-i18n="nav.settings">
            设置
          </span>
        </button>

      </nav>

      <!-- 侧边栏底部 -->
      <div class="sidebar-footer">
        <span class="sidebar-version">
          NUCtool
        </span>

        <span class="sidebar-version">
          v1.0.7
        </span>
      </div>

    </aside>


    <!-- =====================================================
         主内容区域
         ===================================================== -->
    <main class="content">
    </main>

  </div>


  <!-- =====================================================
       页面加载器
       ===================================================== -->
  <script type="module" src="bootstrap.js"></script>

</body>

</html>
